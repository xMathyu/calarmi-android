name: Publicar en Google Play

# CD: un tag `v*` (o el botón «Run workflow») compila el AAB firmado con la llave
# de subida y lo publica en una pista de Google Play.
#
#   git tag v1.1.1 && git push origin v1.1.1
#
# Sin llaves de Google en GitHub: el permiso para publicar sale de Workload
# Identity Federation. GitHub firma un token OIDC que dice «soy el repo
# xMathyu/calarmi-android», Google Cloud lo cambia por un token de una hora de la
# cuenta de servicio `calarmi-play-publisher`, y esa cuenta es la que tiene permiso
# en Play Console. `GCP_WIF_PROVIDER` y `GCP_PLAY_SA` son variables (identificadores,
# no secretos) y solo sirven desde este repositorio.
#
# Lo único secreto es la llave de subida (`UPLOAD_KEYSTORE_BASE64`,
# `UPLOAD_STORE_PASSWORD`, `UPLOAD_KEY_ALIAS`, `UPLOAD_KEY_PASSWORD`): se cargan una
# vez con `tools/ci/configurar-secretos.sh`.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      track:
        description: 'Pista de Play (alpha = prueba cerrada, internal, production)'
        default: alpha
        required: true
      status:
        description: 'completed (se envía a revisión) o draft (queda en borrador)'
        default: completed
        required: true

concurrency:
  # Nunca dos publicaciones a la vez: dos ediciones abiertas en Play chocan.
  group: publicar-play
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write   # para pedir el token OIDC de Workload Identity Federation

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TRACK: ${{ inputs.track || 'alpha' }}
      STATUS: ${{ inputs.status || 'completed' }}
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar la configuración
        env:
          KEYSTORE: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          WIF: ${{ vars.GCP_WIF_PROVIDER }}
          SA: ${{ vars.GCP_PLAY_SA }}
        run: |
          missing=""
          [ -n "$KEYSTORE" ] || missing="$missing UPLOAD_KEYSTORE_BASE64 (secreto: tools/ci/configurar-secretos.sh)"
          [ -n "$WIF" ] || missing="$missing GCP_WIF_PROVIDER (variable)"
          [ -n "$SA" ] || missing="$missing GCP_PLAY_SA (variable)"
          if [ -n "$missing" ]; then echo "::error::Falta:$missing"; exit 1; fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Llave de subida
        env:
          KEYSTORE: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload.jks"
          {
            echo "storeFile=$RUNNER_TEMP/upload.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Número de versión
        # versionCode: 100 + número de corrida (siempre crece; la última subida a mano fue 4).
        # versionName: el del tag (v1.1.1 → 1.1.1) o, a mano, el de app/build.gradle.kts.
        run: |
          echo "VERSION_CODE=$((100 + ${{ github.run_number }}))" >> "$GITHUB_ENV"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "VERSION_NAME_ARG=-Pcalarmi.versionName=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          fi

      - name: AAB firmado
        run: ./gradlew --no-daemon :app:bundleRelease -Pcalarmi.versionCode=$VERSION_CODE $VERSION_NAME_ARG

      - name: Comprobar la firma
        # Si el AAB no salió firmado con la llave de subida, Play lo rechaza: mejor fallar aquí.
        run: |
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab | grep -q "jar verified"
          keytool -printcert -jarfile app/build/outputs/bundle/release/app-release.aab | grep SHA256

      - name: Guardar el AAB
        uses: actions/upload-artifact@v4
        with:
          name: calarmi-${{ env.VERSION_CODE }}-aab
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - uses: google-github-actions/auth@v2
        id: auth
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_PLAY_SA }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher

      - name: Publicar en Google Play
        # El AAB lleva dentro el mapa de R8 (BUNDLE-METADATA): Play lo usa para
        # desofuscar los fallos, sin subirlo aparte.
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          python3 tools/ci/publicar_play.py \
            --package com.mathyusolutions.calarmi \
            --aab app/build/outputs/bundle/release/app-release.aab \
            --track "$TRACK" --status "$STATUS" \
            --notes store/listing
