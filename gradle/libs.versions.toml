composeBom = "2026.11.01"
materialIconsExtended = "1.7.8"
activityCompose = "1.13.0"
appcompat = "1.8.0"
coreKtx = "1.19.1"
coreSplashscreen = "1.2.0"
lifecycle = "2.11.1"
navigation = "2.10.2"
