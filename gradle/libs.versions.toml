# Firebase (lo compartido): BoM + plugin de google-services. Mismo BoM para auth, Firestore y FCM.
firebaseBom = "35.1.0"
googleServices = "4.5.0"
junit = "4.13.2"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
